version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: quickbite-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quickbite-backend
    restart: always
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - DEBUG=False
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=quickbite
      - SECRET_KEY=quickbite_super_secret_jwt_key_2026_production_viva_grade
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GST_PERCENTAGE=5.0
      - DEFAULT_DELIVERY_CHARGE=40.0
      - FREE_DELIVERY_THRESHOLD=500.0
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quickbite-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
